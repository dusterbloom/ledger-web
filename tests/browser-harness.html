<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ledger browser smoke test</title></head>
<body data-status="running">
<pre id="result">running</pre>
<script>
const result = document.querySelector("#result");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function deleteDatabase(name) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("database deletion blocked"));
  });
}

async function seedDatabase(rows) {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open("ledger-web", 1);
    request.onupgradeneeded = () => {
      const next = request.result;
      const fragments = next.createObjectStore("fragments", { keyPath: "id" });
      fragments.createIndex("createdAt", "createdAt");
      fragments.createIndex("undoUntil", "undoUntil");
      next.createObjectStore("meta", { keyPath: "key" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const tx = db.transaction("fragments", "readwrite");
  for (const row of rows) tx.objectStore("fragments").put(row);
  await new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("seed transaction failed"));
  });
  db.close();
}

async function holdFragmentWrites() {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open("ledger-web");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const tx = db.transaction("fragments", "readwrite");
  const store = tx.objectStore("fragments");
  let released = false;
  const done = new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("hold transaction failed"));
  });
  function keepAlive() {
    const request = store.get("hold");
    request.onsuccess = () => { if (!released) keepAlive(); };
  }
  keepAlive();
  return async () => {
    released = true;
    await done;
    db.close();
  };
}

async function until(check, message = "condition timed out") {
  const deadline = performance.now() + 5000;
  while (performance.now() < deadline) {
    if (await check()) return;
    await wait(25);
  }
  throw new Error(message);
}

const frame = document.createElement("iframe");
const frameWin = () => frame.contentWindow;
const frameDoc = () => frame.contentDocument;

async function ready() {
  await until(() => Boolean(frameWin()?.__ledgerTest), "test interface missing");
  await frameWin().__ledgerTest.ready;
}

async function reloadFrame() {
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await loaded;
  await ready();
}

function inputText(entry, value) {
  entry.value = value;
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: value.slice(-1) }));
}

function observeWriteTransactions() {
  const prototype = frameWin().IDBDatabase.prototype;
  const original = prototype.transaction;
  let count = 0;
  prototype.transaction = function (stores, mode) {
    if (mode === "readwrite") count += 1;
    return original.apply(this, arguments);
  };
  return {
    count: () => count,
    restore() { prototype.transaction = original; },
  };
}

async function runFailureAndKeyboardChecks() {
  const entry = frameDoc().querySelector("#entry");
  assert(frameDoc().activeElement === entry, "fine-pointer startup did not focus the composer");
  assert(getComputedStyle(frameDoc().querySelector("#undoToast")).display === "none",
    "hidden Undo toast remained visually exposed");

  const search = frameDoc().querySelector("#search");
  search.value = "select me";
  frameDoc().dispatchEvent(new KeyboardEvent("keydown", {
    key: "f", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  assert(frameDoc().activeElement === search, "Control+F did not focus Ledger search");
  assert(search.selectionStart === 0 && search.selectionEnd === search.value.length,
    "Control+F did not select the search query");
  frameDoc().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  assert(search.value === "", "Escape did not clear Ledger search");
  frameDoc().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  assert(frameDoc().activeElement === entry, "Escape with no search did not focus the composer");
  const plainEnter = new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true });
  entry.dispatchEvent(plainEnter);
  assert(!plainEnter.defaultPrevented, "plain Enter was prevented instead of remaining a newline");

  inputText(entry, "must remain");
  frameWin().__ledgerTest.failNextCaptureTransaction();
  frameDoc().querySelector("#save").click();
  await until(() => frameDoc().querySelector("#status").textContent.includes("not saved"),
    "aborted capture did not report that it was not saved");
  assert(entry.value === "must remain", "aborted capture changed the exact composer text");
  assert((await frameWin().__ledgerTest.readAll()).fragments.length === 0,
    "aborted capture left a durable fragment");

  frameDoc().querySelector("#save").click();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 1,
    "capture retry did not commit");
  const retried = await frameWin().__ledgerTest.readAll();
  assert(retried.fragments.length === 1 && retried.fragments[0].text === "must remain",
    "capture retry did not create exactly one durable fragment");
  assert(frameDoc().activeElement === entry, "successful save did not restore composer focus");

  const announcementsBefore = frameWin().__ledgerTest.draftFailureAnnouncements();
  frameWin().__ledgerTest.failNextDraftTransactions(2);
  inputText(entry, "first failed draft");
  await wait(300);
  inputText(entry, "second failed draft");
  await wait(300);
  assert(frameWin().__ledgerTest.draftFailureAnnouncements() === announcementsBefore + 1,
    "one draft failure episode announced more than once");
  inputText(entry, "draft recovery");
  await until(async () => (await frameWin().__ledgerTest.readAll()).draft === "draft recovery",
    "draft did not recover after injected failures");
  frameWin().__ledgerTest.failNextDraftTransactions(1);
  inputText(entry, "new failed episode");
  await wait(300);
  assert(frameWin().__ledgerTest.draftFailureAnnouncements() === announcementsBefore + 2,
    "a new draft failure episode was not announced");

  await frameWin().__ledgerTest.resetState();
}

async function runFocusedOverlap() {
  const releaseCaptures = await holdFragmentWrites();
  const entry = frameDoc().querySelector("#entry");
  entry.value = "overlap first";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  entry.value = "overlap second";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  await wait(400);
  await reloadFrame();
  const state = await frameWin().__ledgerTest.readAll();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  assert(state.draft === "", "stale overlap draft survived both captures");
  assert(state.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(state.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "overlapping captures left no stale draft";
}

async function verifyRestoreAbort() {
  const before = await frameWin().__ledgerTest.readAll();
  await frameWin().__ledgerTest.seedStoredOnly([
    { id: "restore-race", createdAt: 3, text: "already on disk" },
  ]);
  const durableBeforeAbort = await frameWin().__ledgerTest.readAll();
  const visibleBeforeAbort = [...frameDoc().querySelectorAll("#stream .frag")]
    .map((row) => row.dataset.fragmentId);
  let restoreAborted = false;
  try {
    await frameWin().__ledgerTest.restoreRows([
      { id: "abort-first", createdAt: 4, text: "must roll back" },
      { id: "restore-race", createdAt: 5, text: "constraint failure" },
    ]);
  } catch {
    restoreAborted = true;
  }
  assert(restoreAborted, "later duplicate add did not abort the real restore transaction");
  const durableAfterAbort = await frameWin().__ledgerTest.readAll();
  assert(JSON.stringify(durableAfterAbort.fragments) === JSON.stringify(durableBeforeAbort.fragments),
    "aborted restore changed durable fragments");
  const visibleAfterAbort = [...frameDoc().querySelectorAll("#stream .frag")]
    .map((row) => row.dataset.fragmentId);
  assert(JSON.stringify(visibleAfterAbort) === JSON.stringify(visibleBeforeAbort),
    "aborted restore changed in-memory rendering");
  await frameWin().__ledgerTest.seedFragments(before.fragments);
}

async function runFocusedRestore() {
  await frameWin().__ledgerTest.seedFragments([
    { id: "restore-visible", createdAt: 1, text: "original" },
  ]);
  await verifyRestoreAbort();
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "aborted restore changed neither disk nor memory";
}

function fragmentButton(id) {
  return [...frameDoc().querySelectorAll("#stream .drop")]
    .find((button) => button.dataset.fragmentId === id);
}

function undoButton(id) {
  return [...frameDoc().querySelectorAll("#deletedDialog [data-undo-id]")]
    .find((button) => button.dataset.undoId === id);
}

async function runDeletionChecks() {
  const initial = await frameWin().__ledgerTest.readAll();
  const visibleIds = [...frameDoc().querySelectorAll("#stream .drop")]
    .map((button) => button.dataset.fragmentId);
  const [first, second] = visibleIds
    .map((id) => initial.fragments.find((fragment) => fragment.id === id));
  assert(first && second, "deletion checks need two live fragments");

  const baseNow = Date.now();
  frameWin().__ledgerTest.setNow(baseNow);
  fragmentButton(first.id).click();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === first.id);
    return stored?.deletedAt === baseNow && stored?.undoUntil === baseNow + 30000;
  }, "delete was not persisted as a 30-second tombstone");
  assert(frameDoc().activeElement === frameDoc().querySelector("#undo"), "Delete did not move focus to Undo");
  assert(!fragmentButton(first.id), "deleted fragment remained visible");

  await reloadFrame();
  const recentlyDeleted = frameDoc().querySelector("#recentlyDeleted");
  assert(!recentlyDeleted.hidden, "recently deleted control did not survive reload");
  recentlyDeleted.click();
  assert(frameDoc().querySelector("#deletedDialog").open, "recently deleted dialog did not open");
  undoButton(first.id).click();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === first.id);
    return stored && !Number.isFinite(stored.deletedAt);
  }, "Undo did not restore the durable fragment");
  assert(fragmentButton(first.id), "Undo did not restore the fragment chronologically");
  assert(frameDoc().activeElement === fragmentButton(first.id), "Undo did not focus the restored fragment Delete control");

  frameWin().__ledgerTest.setNow(baseNow + 10);
  fragmentButton(first.id).click();
  await until(() => !fragmentButton(first.id), "first consecutive deletion stayed visible");
  frameWin().__ledgerTest.setNow(baseNow + 11);
  fragmentButton(second.id).click();
  await until(() => !fragmentButton(second.id), "second consecutive deletion stayed visible");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 30010, "nearest tombstone expiry was not scheduled");
  assert(frameDoc().querySelector("#undo").dataset.undoId === second.id, "toast did not target the newest deletion");
  frameDoc().querySelector("#recentlyDeleted").click();
  assert(undoButton(first.id) && undoButton(second.id), "not every recent deletion was accessible");
  frameDoc().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  assert(!frameDoc().querySelector("#deletedDialog").open, "Escape did not close the open dialog");
  assert(frameDoc().activeElement === frameDoc().querySelector("#recentlyDeleted"),
    "closing the dialog did not restore trigger focus");
  frameDoc().querySelector("#recentlyDeleted").click();
  undoButton(first.id).click();
  await until(() => Boolean(undoButton(second.id)), "remaining deletion disappeared after another Undo");
  undoButton(second.id).click();
  await until(() => fragmentButton(first.id) && fragmentButton(second.id), "consecutive deletions were not both restored");

  frameWin().__ledgerTest.setNow(baseNow + 100);
  fragmentButton(first.id).click();
  await until(() => !fragmentButton(first.id), "first fragment stayed visible before expiry failure test");
  frameWin().__ledgerTest.setNow(baseNow + 1000);
  fragmentButton(second.id).click();
  await until(() => !fragmentButton(second.id), "second fragment stayed visible before expiry failure test");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 30100, "expiry timer used the wrong deadline");
  frameDoc().querySelector("#recentlyDeleted").click();
  assert(undoButton(first.id) && undoButton(second.id), "expiry failure setup did not expose both tombstones");
  frameWin().__ledgerTest.failNextExpiryPurge();
  frameWin().__ledgerTest.setNow(baseNow + 30100);
  await frameWin().__ledgerTest.fireExpiryTimer();
  const failedPurge = await frameWin().__ledgerTest.readAll();
  assert(failedPurge.fragments.some((fragment) => fragment.id === first.id), "forced purge failure did not preserve the tombstone");
  assert(!undoButton(first.id) && undoButton(second.id), "purge failure did not remove expired Undo controls");
  assert(!frameDoc().querySelector("#undoToast").hidden, "purge failure did not refresh the surviving Undo toast");
  assert(frameDoc().querySelector("#undo").dataset.undoId === second.id, "purge failure left the expired tombstone in the toast");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 31000, "purge failure did not schedule the next future expiry");

  frameWin().__ledgerTest.setNow(baseNow + 31000);
  await frameWin().__ledgerTest.fireExpiryTimer();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments;
    return !stored.some((fragment) => fragment.id === first.id || fragment.id === second.id);
  }, "future expiry did not retry cleanup in-session");
  assert(frameDoc().querySelector("#undoToast").hidden, "expired Undo toast remained visible");
  assert(frameDoc().querySelector("#recentlyDeleted").hidden, "expired recently deleted control remained visible");
  await reloadFrame();
  const expired = (await frameWin().__ledgerTest.readAll()).fragments;
  assert(!expired.some((fragment) => fragment.id === first.id || fragment.id === second.id), "expired tombstone survived reload cleanup");
}

async function run() {
  result.textContent = "deleting database";
  await deleteDatabase("ledger-web");
  localStorage.clear();
  const malformedLegacy = "{ untouched malformed legacy";
  localStorage.setItem("ledger.fragments", malformedLegacy);
  const startupNow = Date.now();
  await seedDatabase([
    { id: "startup-readable", createdAt: 1, text: "existing backup data" },
    {
      id: "startup-tombstone", createdAt: 2, text: "existing deleted data",
      deletedAt: startupNow, undoUntil: startupNow + 30000,
    },
  ]);
  sessionStorage.setItem("ledger.testStartupFailure", "quota-after-open");
  result.textContent = "loading application";
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.src = "../index.html?test=1";
  document.body.append(frame);
  await loaded;
  await ready();
  assert(/backup|markdown/i.test(frameDoc().querySelector("#recoveryMessage").textContent),
    "readable startup quota did not offer an available export path");
  assert(!frameDoc().querySelector("#exportJson").disabled
    && !frameDoc().querySelector("#exportMarkdown").disabled,
  "readable startup quota disabled its export actions");
  assert(frameDoc().querySelector("#save").disabled && frameDoc().querySelector("#import").disabled,
    "readable startup quota left persistence actions enabled");
  const readableQuota = await frameWin().__ledgerTest.readAll();
  assert(readableQuota.fragments.length === 2
    && readableQuota.fragments.some((fragment) => fragment.text === "existing backup data"),
  "startup quota did not preserve a verified readable snapshot");
  assert(frameDoc().querySelector(".drop").disabled
    && frameDoc().querySelector("#undo").disabled
    && frameDoc().querySelector("#recentlyDeleted").disabled,
  "readable startup quota left fragment mutation controls enabled");

  const writeObserver = observeWriteTransactions();
  const quotaEntry = frameDoc().querySelector("#entry");
  const guardedText = "quota recovery edit must remain exact";
  const readableBeforeMutationAttempts = JSON.stringify(await frameWin().__ledgerTest.readAll());
  inputText(quotaEntry, guardedText);
  assert(writeObserver.count() === 0, "input wrote to IndexedDB while persistence was read-only");
  quotaEntry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await wait(50);
  assert(writeObserver.count() === 0, "Control+Enter wrote to IndexedDB while persistence was read-only");
  assert(quotaEntry.value === guardedText, "read-only Control+Enter changed the exact composer text");
  quotaEntry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", metaKey: true, bubbles: true, cancelable: true,
  }));
  await wait(50);
  assert(writeObserver.count() === 0, "Command+Enter wrote to IndexedDB while persistence was read-only");
  await wait(300);
  assert(writeObserver.count() === 0, "draft debounce wrote to IndexedDB while persistence was read-only");
  assert(frameDoc().querySelector("#status").textContent === "Draft not saved. Your text is still here.",
    "read-only draft debounce falsely claimed durability");
  Object.defineProperty(frameDoc(), "visibilityState", { configurable: true, value: "hidden" });
  frameDoc().dispatchEvent(new (frameWin().Event)("visibilitychange"));
  delete frameDoc().visibilityState;
  frameWin().dispatchEvent(new (frameWin().PageTransitionEvent)("pagehide"));
  await wait(25);
  assert(writeObserver.count() === 0, "visibility/pagehide flush wrote while persistence was read-only");
  await frameWin().__ledgerTest.saveDraftDirect("direct draft must not persist");
  await frameWin().__ledgerTest.appendFragmentDirect("direct fragment must not persist");
  assert(writeObserver.count() === 0, "direct mutation calls wrote while persistence was read-only");
  assert(JSON.stringify(await frameWin().__ledgerTest.readAll()) === readableBeforeMutationAttempts,
    "read-only recovery mutation attempts changed the verified database snapshot");
  assert(quotaEntry.value === guardedText, "read-only mutation attempts changed the exact composer text");
  const quotaEpisodeAnnouncements = frameWin().__ledgerTest.draftFailureAnnouncements();
  writeObserver.restore();

  frameDoc().querySelector("#exportJson").click();
  await until(() => frameDoc().querySelector("#status").textContent === "Backup ready to download.",
    "readable startup quota Backup action did not work");
  localStorage.removeItem("ledger.fragments");
  frameDoc().querySelector("#retryStartup").click();
  await until(() => frameDoc().querySelector("#recovery").hidden
    && !frameDoc().querySelector("#save").disabled, "readable quota Retry did not restore writable persistence");
  assert(frameDoc().querySelector("#entry").value === guardedText,
    "readable quota Retry changed the exact in-memory composer text");
  frameWin().__ledgerTest.failNextDraftTransactions(1);
  await frameWin().__ledgerTest.saveDraftDirect(guardedText).catch(() => undefined);
  assert(frameWin().__ledgerTest.draftFailureAnnouncements() === quotaEpisodeAnnouncements + 1,
    "writable Retry did not start a new draft-failure announcement episode");
  assert(frameDoc().querySelector("#entry").value === guardedText,
    "failed post-Retry draft save changed the exact composer text");
  frameDoc().querySelector("#entry").dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments
    .filter((fragment) => fragment.text === guardedText).length === 1,
  "composer did not save normally after readable quota Retry");
  assert(frameDoc().querySelector("#entry").value === "",
    "successful post-Retry save did not clear the composer");
  frameWin().__ledgerTest.closeDatabase();
  await deleteDatabase("ledger-web");
  localStorage.setItem("ledger.fragments", malformedLegacy);
  frameWin().sessionStorage.setItem("ledger.testStartupFailure", "quota-before-open");
  await reloadFrame();
  assert(!/backup|markdown/i.test(frameDoc().querySelector("#recoveryMessage").textContent),
    "no-data startup quota recommended disabled export actions");
  assert(frameDoc().querySelector("#exportJson").disabled
    && frameDoc().querySelector("#exportMarkdown").disabled,
  "no-data startup quota enabled export actions without a readable snapshot");
  inputText(frameDoc().querySelector("#entry"), "quota composer must remain exact");
  frameWin().sessionStorage.setItem("ledger.testStartupFailure", "blocked");
  frameDoc().querySelector("#retryStartup").click();
  await until(() => /other Ledger tabs/i.test(frameDoc().querySelector("#recoveryMessage").textContent),
    "retry after no-data quota did not reach blocked startup recovery");
  assert(!frameDoc().querySelector("#recovery").hidden, "blocked startup recovery was not shown");
  assert(/other Ledger tabs/i.test(frameDoc().querySelector("#recoveryMessage").textContent),
    "blocked startup did not explain how to unblock storage");
  assert(frameDoc().querySelector("#save").disabled && frameDoc().querySelector("#import").disabled,
    "blocked startup left persistence actions enabled");
  assert(!frameDoc().querySelector("#entry").hidden, "blocked startup hid the composer");
  frameDoc().querySelector("#retryStartup").click();
  await until(() => !frameDoc().querySelector("#downloadLegacy").hidden,
    "retry after blocked startup did not reach malformed legacy recovery");
  assert(frameDoc().querySelector("#entry").value === "quota composer must remain exact",
    "startup quota retries changed the exact composer text");
  assert(localStorage.getItem("ledger.fragments") === malformedLegacy,
    "malformed legacy data changed during startup");
  assert(!frameDoc().querySelector("#recovery").hidden, "malformed legacy recovery was not shown");
  assert(!frameDoc().querySelector("#downloadLegacy").hidden,
    "malformed legacy recovery did not offer the raw download");
  localStorage.removeItem("ledger.fragments");
  frameDoc().querySelector("#retryStartup").click();
  await until(() => frameDoc().querySelector("#recovery").hidden
    && !frameDoc().querySelector("#save").disabled, "startup retry did not recover");
  assert(frameDoc().querySelector("#entry").value === "quota composer must remain exact",
    "successful startup retry replaced the quota composer text");
  const focus = new URL(location.href).searchParams.get("focus");
  if (focus === "overlap") {
    await runFocusedOverlap();
    return;
  }
  if (focus === "restore") {
    await runFocusedRestore();
    return;
  }

  await runFailureAndKeyboardChecks();

  result.textContent = "saving draft";
  const entry = frameDoc().querySelector("#entry");
  entry.value = "draft survives";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "s" }));
  await wait(400);
  result.textContent = "reloading application";
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "draft survives", "draft did not survive reload");

  const current = frameDoc().querySelector("#entry");
  result.textContent = "committing fragment";
  current.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 1);
  assert(frameDoc().querySelector("#entry").value === "", "composer did not clear after commit");

  const state = await frameWin().__ledgerTest.readAll();
  assert(state.fragments[0].text === "draft survives", "committed fragment text changed");
  assert(state.draft === "", "draft was not cleared atomically");

  const pending = frameDoc().querySelector("#entry");
  pending.value = "submitted snapshot";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "typed during save";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  assert(pending.value === "typed during save", "newer composer text was erased");
  await wait(400);
  const pendingState = await frameWin().__ledgerTest.readAll();
  assert(pendingState.fragments.some((fragment) => fragment.text === "submitted snapshot"), "submitted snapshot changed");
  assert(pendingState.draft === "typed during save", "newer composer text was not persisted");

  const releaseOverlappingCaptures = await holdFragmentWrites();
  pending.value = "overlap first";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "overlap second";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseOverlappingCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 4);
  await wait(400);
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  const overlapState = await frameWin().__ledgerTest.readAll();
  assert(overlapState.draft === "", "stale overlap draft survived both captures");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");

  await frameWin().__ledgerTest.seedFragments([
    { id: "restore-same", createdAt: 1, text: "original" },
  ]);
  const restoreSummary = await frameWin().__ledgerTest.restoreRows([
    { id: "restore-same", createdAt: 1, text: "original" },
    { id: "restore-same", createdAt: 1, text: "changed" },
    { id: "restore-new", createdAt: 2, text: "added" },
    { id: "restore-invalid", createdAt: -1, text: "invalid" },
  ]);
  assert(restoreSummary.added === 1, "restore did not append exactly one unique record");
  assert(restoreSummary.duplicates === 1, "restore did not report its duplicate");
  assert(restoreSummary.conflicts === 1, "restore did not report its conflict");
  assert(restoreSummary.invalid === 1, "restore did not report its invalid record");
  const restoredState = await frameWin().__ledgerTest.readAll();
  assert(restoredState.fragments.find((row) => row.id === "restore-same")?.text === "original",
    "restore conflict replaced existing text");
  assert(restoredState.fragments.find((row) => row.id === "restore-new")?.text === "added",
    "restore unique record was not committed");

  await verifyRestoreAbort();

  const fileInput = frameDoc().querySelector("#fileInput");
  const imported = new DataTransfer();
  imported.items.add(new File(["first imported block\n\nsecond imported block"], "notes.txt", {
    type: "text/plain", lastModified: 40,
  }));
  fileInput.files = imported.files;
  fileInput.dispatchEvent(new Event("change", { bubbles: true }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 4,
    "text blocks were not imported in one selection");
  assert(fileInput.value === "", "file input did not reset after import");
  assert(frameDoc().activeElement === frameDoc().querySelector("#import"),
    "returning from import did not restore focus to Import");
  const textImportState = await frameWin().__ledgerTest.readAll();
  const textRows = textImportState.fragments.filter((row) => row.source === "from notes.txt")
    .sort((a, b) => a.createdAt - b.createdAt);
  assert(textRows.length === 2, "text import did not preserve both non-empty blocks");
  assert(textRows[0].createdAt === 40 && textRows[1].createdAt === 41,
    "text import did not use stable millisecond offsets");

  const rows = Array.from({ length: 250 }, (_, index) => ({
    id: "batch-" + index,
    createdAt: index + 1,
    text: "batch fragment " + index,
  }));
  rows[249] = {
    id: "safe-text", createdAt: 250,
    text: "<img src=x onerror=window.__ledgerXss=1>", source: "Needle notebook",
  };
  rows[248] = { id: "partial-match", createdAt: 249, text: "Needle only" };
  rows[247] = { id: "deleted-match", createdAt: 248, text: "Needle notebook" };
  await frameWin().__ledgerTest.seedFragments(rows);
  assert(frameDoc().querySelectorAll("#stream .frag").length === 100, "initial render did not stop at 100 fragments");
  assert(frameDoc().querySelector("#stream h2"), "fragments were not grouped beneath a day heading");
  frameDoc().querySelector("#loadMore").click();
  assert(frameDoc().querySelectorAll("#stream .frag").length === 200, "first Load more did not add exactly 100 fragments");
  frameDoc().querySelector("#loadMore").click();
  assert(frameDoc().querySelectorAll("#stream .frag").length === 250, "second Load more did not render the remaining fragments");
  const search = frameDoc().querySelector("#search");
  search.value = "batch";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "h" }));
  assert(frameDoc().querySelectorAll("#stream .frag").length === 100, "query change did not reset the render batch to 100");
  search.value = "";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward", data: null }));
  fragmentButton("deleted-match").click();
  await until(() => !fragmentButton("deleted-match"), "matching tombstone was not deleted before search");

  search.value = "needle notebook";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "k" }));
  assert(frameDoc().querySelectorAll("#stream .frag").length === 1, "search did not require every token or exclude tombstones");
  assert(frameDoc().querySelector("#counts").textContent === "1 match", "search count was not exact");
  const safeFragment = frameDoc().querySelector("#stream .frag");
  assert(safeFragment.textContent.includes("<img src=x onerror=window.__ledgerXss=1>"), "fragment HTML was not rendered as text");
  assert(!safeFragment.querySelector("img"), "fragment HTML created an image element");
  assert(safeFragment.querySelector("mark"), "matching text was not highlighted with mark");
  frameDoc().querySelector("#undo").click();
  await until(async () => {
    const restored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === "deleted-match");
    return restored && !Number.isFinite(restored.deletedAt);
  }, "search tombstone was not restored after the assertion");
  assert(frameDoc().activeElement === fragmentButton("deleted-match"),
    "Undo did not focus its restored visible fragment");

  search.value = "";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward", data: null }));
  fragmentButton("safe-text").click();
  await until(() => !fragmentButton("safe-text"), "offscreen focus setup did not delete its fragment");
  search.value = "no fragment can match this query";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "y" }));
  frameDoc().querySelector("#undo").click();
  await until(async () => {
    const restored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === "safe-text");
    return restored && !Number.isFinite(restored.deletedAt);
  }, "offscreen fragment was not restored");
  assert(frameDoc().activeElement === frameDoc().querySelector("#entry"),
    "Undo did not focus the composer when its restored fragment was offscreen");
  search.value = "";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward", data: null }));

  const releaseWrites = await holdFragmentWrites();
  const previousDocument = frameDoc();
  const loadedWithInput = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await until(() => frameDoc() !== previousDocument && Boolean(frameWin()?.__ledgerTest), "reloaded test interface missing");
  const startupEntry = frameDoc().querySelector("#entry");
  startupEntry.value = "typed before restore";
  startupEntry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await releaseWrites();
  await loadedWithInput;
  await frameWin().__ledgerTest.ready;
  assert(startupEntry.value === "typed before restore", "startup draft overwrote newer user input");
  result.textContent = "checking persistent deletion and Undo";
  await runDeletionChecks();
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "recovered drafts, capped rendering, and verified persistent deletion Undo";
}

run().catch((error) => {
  document.body.dataset.status = "fail";
  result.textContent = error.stack || String(error);
});
</script>
</body>
</html>
