<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ledger browser smoke test</title></head>
<body data-status="running">
<pre id="result">running</pre>
<script>
const result = document.querySelector("#result");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function deleteDatabase(name) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("database deletion blocked"));
  });
}

async function holdFragmentWrites() {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open("ledger-web");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const tx = db.transaction("fragments", "readwrite");
  const store = tx.objectStore("fragments");
  let released = false;
  const done = new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("hold transaction failed"));
  });
  function keepAlive() {
    const request = store.get("hold");
    request.onsuccess = () => { if (!released) keepAlive(); };
  }
  keepAlive();
  return async () => {
    released = true;
    await done;
    db.close();
  };
}

async function until(check, message = "condition timed out") {
  const deadline = performance.now() + 5000;
  while (performance.now() < deadline) {
    if (await check()) return;
    await wait(25);
  }
  throw new Error(message);
}

const frame = document.createElement("iframe");
const frameWin = () => frame.contentWindow;
const frameDoc = () => frame.contentDocument;

async function ready() {
  await until(() => Boolean(frameWin()?.__ledgerTest), "test interface missing");
  await frameWin().__ledgerTest.ready;
}

async function reloadFrame() {
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await loaded;
  await ready();
}

async function runFocusedOverlap() {
  const releaseCaptures = await holdFragmentWrites();
  const entry = frameDoc().querySelector("#entry");
  entry.value = "overlap first";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  entry.value = "overlap second";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  await wait(400);
  await reloadFrame();
  const state = await frameWin().__ledgerTest.readAll();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  assert(state.draft === "", "stale overlap draft survived both captures");
  assert(state.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(state.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "overlapping captures left no stale draft";
}

function fragmentButton(id) {
  return [...frameDoc().querySelectorAll("#stream .drop")]
    .find((button) => button.dataset.fragmentId === id);
}

function undoButton(id) {
  return [...frameDoc().querySelectorAll("#deletedDialog [data-undo-id]")]
    .find((button) => button.dataset.undoId === id);
}

async function runDeletionChecks() {
  const initial = await frameWin().__ledgerTest.readAll();
  const visibleIds = [...frameDoc().querySelectorAll("#stream .drop")]
    .map((button) => button.dataset.fragmentId);
  const [first, second] = visibleIds
    .map((id) => initial.fragments.find((fragment) => fragment.id === id));
  assert(first && second, "deletion checks need two live fragments");

  const baseNow = Date.now();
  frameWin().__ledgerTest.setNow(baseNow);
  fragmentButton(first.id).click();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === first.id);
    return stored?.deletedAt === baseNow && stored?.undoUntil === baseNow + 30000;
  }, "delete was not persisted as a 30-second tombstone");
  assert(!fragmentButton(first.id), "deleted fragment remained visible");

  await reloadFrame();
  const recentlyDeleted = frameDoc().querySelector("#recentlyDeleted");
  assert(!recentlyDeleted.hidden, "recently deleted control did not survive reload");
  recentlyDeleted.click();
  assert(frameDoc().querySelector("#deletedDialog").open, "recently deleted dialog did not open");
  undoButton(first.id).click();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === first.id);
    return stored && !Number.isFinite(stored.deletedAt);
  }, "Undo did not restore the durable fragment");
  assert(fragmentButton(first.id), "Undo did not restore the fragment chronologically");

  frameWin().__ledgerTest.setNow(baseNow + 10);
  fragmentButton(first.id).click();
  await until(() => !fragmentButton(first.id), "first consecutive deletion stayed visible");
  frameWin().__ledgerTest.setNow(baseNow + 11);
  fragmentButton(second.id).click();
  await until(() => !fragmentButton(second.id), "second consecutive deletion stayed visible");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 30010, "nearest tombstone expiry was not scheduled");
  assert(frameDoc().querySelector("#undo").dataset.undoId === second.id, "toast did not target the newest deletion");
  frameDoc().querySelector("#recentlyDeleted").click();
  assert(undoButton(first.id) && undoButton(second.id), "not every recent deletion was accessible");
  undoButton(first.id).click();
  await until(() => Boolean(undoButton(second.id)), "remaining deletion disappeared after another Undo");
  undoButton(second.id).click();
  await until(() => fragmentButton(first.id) && fragmentButton(second.id), "consecutive deletions were not both restored");

  frameWin().__ledgerTest.setNow(baseNow + 100);
  fragmentButton(first.id).click();
  await until(() => !fragmentButton(first.id), "first fragment stayed visible before expiry failure test");
  frameWin().__ledgerTest.setNow(baseNow + 1000);
  fragmentButton(second.id).click();
  await until(() => !fragmentButton(second.id), "second fragment stayed visible before expiry failure test");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 30100, "expiry timer used the wrong deadline");
  frameDoc().querySelector("#recentlyDeleted").click();
  assert(undoButton(first.id) && undoButton(second.id), "expiry failure setup did not expose both tombstones");
  frameWin().__ledgerTest.failNextExpiryPurge();
  frameWin().__ledgerTest.setNow(baseNow + 30100);
  await frameWin().__ledgerTest.fireExpiryTimer();
  const failedPurge = await frameWin().__ledgerTest.readAll();
  assert(failedPurge.fragments.some((fragment) => fragment.id === first.id), "forced purge failure did not preserve the tombstone");
  assert(!undoButton(first.id) && undoButton(second.id), "purge failure did not remove expired Undo controls");
  assert(!frameDoc().querySelector("#undoToast").hidden, "purge failure did not refresh the surviving Undo toast");
  assert(frameDoc().querySelector("#undo").dataset.undoId === second.id, "purge failure left the expired tombstone in the toast");
  assert(frameWin().__ledgerTest.nextExpiryAt() === baseNow + 31000, "purge failure did not schedule the next future expiry");

  frameWin().__ledgerTest.setNow(baseNow + 31000);
  await frameWin().__ledgerTest.fireExpiryTimer();
  await until(async () => {
    const stored = (await frameWin().__ledgerTest.readAll()).fragments;
    return !stored.some((fragment) => fragment.id === first.id || fragment.id === second.id);
  }, "future expiry did not retry cleanup in-session");
  assert(frameDoc().querySelector("#undoToast").hidden, "expired Undo toast remained visible");
  assert(frameDoc().querySelector("#recentlyDeleted").hidden, "expired recently deleted control remained visible");
  await reloadFrame();
  const expired = (await frameWin().__ledgerTest.readAll()).fragments;
  assert(!expired.some((fragment) => fragment.id === first.id || fragment.id === second.id), "expired tombstone survived reload cleanup");
}

async function run() {
  result.textContent = "deleting database";
  await deleteDatabase("ledger-web");
  localStorage.clear();
  result.textContent = "loading application";
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.src = "../index.html?test=1";
  document.body.append(frame);
  await loaded;
  await ready();
  if (new URL(location.href).searchParams.get("focus") === "overlap") {
    await runFocusedOverlap();
    return;
  }

  result.textContent = "saving draft";
  const entry = frameDoc().querySelector("#entry");
  entry.value = "draft survives";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "s" }));
  await wait(400);
  result.textContent = "reloading application";
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "draft survives", "draft did not survive reload");

  const current = frameDoc().querySelector("#entry");
  result.textContent = "committing fragment";
  current.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 1);
  assert(frameDoc().querySelector("#entry").value === "", "composer did not clear after commit");

  const state = await frameWin().__ledgerTest.readAll();
  assert(state.fragments[0].text === "draft survives", "committed fragment text changed");
  assert(state.draft === "", "draft was not cleared atomically");

  const pending = frameDoc().querySelector("#entry");
  pending.value = "submitted snapshot";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "typed during save";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  assert(pending.value === "typed during save", "newer composer text was erased");
  await wait(400);
  const pendingState = await frameWin().__ledgerTest.readAll();
  assert(pendingState.fragments.some((fragment) => fragment.text === "submitted snapshot"), "submitted snapshot changed");
  assert(pendingState.draft === "typed during save", "newer composer text was not persisted");

  const releaseOverlappingCaptures = await holdFragmentWrites();
  pending.value = "overlap first";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "overlap second";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseOverlappingCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 4);
  await wait(400);
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  const overlapState = await frameWin().__ledgerTest.readAll();
  assert(overlapState.draft === "", "stale overlap draft survived both captures");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");

  const rows = Array.from({ length: 250 }, (_, index) => ({
    id: "batch-" + index,
    createdAt: index + 1,
    text: "batch fragment " + index,
  }));
  rows[249] = {
    id: "safe-text", createdAt: 250,
    text: "<img src=x onerror=window.__ledgerXss=1>", source: "Needle notebook",
  };
  rows[248] = { id: "partial-match", createdAt: 249, text: "Needle only" };
  rows[247] = { id: "deleted-match", createdAt: 248, text: "Needle notebook" };
  await frameWin().__ledgerTest.seedFragments(rows);
  assert(frameDoc().querySelectorAll("#stream .frag").length === 100, "initial render did not stop at 100 fragments");
  assert(frameDoc().querySelector("#stream h2"), "fragments were not grouped beneath a day heading");
  frameDoc().querySelector("#loadMore").click();
  assert(frameDoc().querySelectorAll("#stream .frag").length === 200, "first Load more did not add exactly 100 fragments");
  frameDoc().querySelector("#loadMore").click();
  assert(frameDoc().querySelectorAll("#stream .frag").length === 250, "second Load more did not render the remaining fragments");
  const search = frameDoc().querySelector("#search");
  search.value = "batch";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "h" }));
  assert(frameDoc().querySelectorAll("#stream .frag").length === 100, "query change did not reset the render batch to 100");
  search.value = "";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward", data: null }));
  fragmentButton("deleted-match").click();
  await until(() => !fragmentButton("deleted-match"), "matching tombstone was not deleted before search");

  search.value = "needle notebook";
  search.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "k" }));
  assert(frameDoc().querySelectorAll("#stream .frag").length === 1, "search did not require every token or exclude tombstones");
  assert(frameDoc().querySelector("#counts").textContent === "1 match", "search count was not exact");
  const safeFragment = frameDoc().querySelector("#stream .frag");
  assert(safeFragment.textContent.includes("<img src=x onerror=window.__ledgerXss=1>"), "fragment HTML was not rendered as text");
  assert(!safeFragment.querySelector("img"), "fragment HTML created an image element");
  assert(safeFragment.querySelector("mark"), "matching text was not highlighted with mark");
  frameDoc().querySelector("#undo").click();
  await until(async () => {
    const restored = (await frameWin().__ledgerTest.readAll()).fragments.find((fragment) => fragment.id === "deleted-match");
    return restored && !Number.isFinite(restored.deletedAt);
  }, "search tombstone was not restored after the assertion");

  const releaseWrites = await holdFragmentWrites();
  const previousDocument = frameDoc();
  const loadedWithInput = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await until(() => frameDoc() !== previousDocument && Boolean(frameWin()?.__ledgerTest), "reloaded test interface missing");
  const startupEntry = frameDoc().querySelector("#entry");
  startupEntry.value = "typed before restore";
  startupEntry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await releaseWrites();
  await loadedWithInput;
  await frameWin().__ledgerTest.ready;
  assert(startupEntry.value === "typed before restore", "startup draft overwrote newer user input");
  result.textContent = "checking persistent deletion and Undo";
  await runDeletionChecks();
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "recovered drafts, capped rendering, and verified persistent deletion Undo";
}

run().catch((error) => {
  document.body.dataset.status = "fail";
  result.textContent = error.stack || String(error);
});
</script>
</body>
</html>
