<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ledger browser smoke test</title></head>
<body data-status="running">
<pre id="result">running</pre>
<script>
const result = document.querySelector("#result");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function deleteDatabase(name) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("database deletion blocked"));
  });
}

async function seedFragments(count) {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open("ledger-web");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const tx = db.transaction("fragments", "readwrite");
  for (let index = 0; index < count; index += 1) {
    tx.objectStore("fragments").put({
      id: "batch-" + index,
      createdAt: index + 1,
      text: "batch fragment " + index,
    });
  }
  await new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("seed transaction failed"));
  });
  db.close();
}

async function holdFragmentWrites() {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open("ledger-web");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const tx = db.transaction("fragments", "readwrite");
  const store = tx.objectStore("fragments");
  let released = false;
  const done = new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("hold transaction failed"));
  });
  function keepAlive() {
    const request = store.get("hold");
    request.onsuccess = () => { if (!released) keepAlive(); };
  }
  keepAlive();
  return async () => {
    released = true;
    await done;
    db.close();
  };
}

async function until(check, message = "condition timed out") {
  const deadline = performance.now() + 5000;
  while (performance.now() < deadline) {
    if (await check()) return;
    await wait(25);
  }
  throw new Error(message);
}

const frame = document.createElement("iframe");
const frameWin = () => frame.contentWindow;
const frameDoc = () => frame.contentDocument;

async function ready() {
  await until(() => Boolean(frameWin()?.__ledgerTest), "test interface missing");
  await frameWin().__ledgerTest.ready;
}

async function reloadFrame() {
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await loaded;
  await ready();
}

async function runFocusedOverlap() {
  const releaseCaptures = await holdFragmentWrites();
  const entry = frameDoc().querySelector("#entry");
  entry.value = "overlap first";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  entry.value = "overlap second";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  entry.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  await wait(400);
  await reloadFrame();
  const state = await frameWin().__ledgerTest.readAll();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  assert(state.draft === "", "stale overlap draft survived both captures");
  assert(state.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(state.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "overlapping captures left no stale draft";
}

async function run() {
  result.textContent = "deleting database";
  await deleteDatabase("ledger-web");
  localStorage.clear();
  result.textContent = "loading application";
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.src = "../index.html?test=1";
  document.body.append(frame);
  await loaded;
  await ready();
  if (new URL(location.href).searchParams.get("focus") === "overlap") {
    await runFocusedOverlap();
    return;
  }

  result.textContent = "saving draft";
  const entry = frameDoc().querySelector("#entry");
  entry.value = "draft survives";
  entry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "s" }));
  await wait(400);
  result.textContent = "reloading application";
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "draft survives", "draft did not survive reload");

  const current = frameDoc().querySelector("#entry");
  result.textContent = "committing fragment";
  current.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 1);
  assert(frameDoc().querySelector("#entry").value === "", "composer did not clear after commit");

  const state = await frameWin().__ledgerTest.readAll();
  assert(state.fragments[0].text === "draft survives", "committed fragment text changed");
  assert(state.draft === "", "draft was not cleared atomically");

  const pending = frameDoc().querySelector("#entry");
  pending.value = "submitted snapshot";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "typed during save";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 2);
  assert(pending.value === "typed during save", "newer composer text was erased");
  await wait(400);
  const pendingState = await frameWin().__ledgerTest.readAll();
  assert(pendingState.fragments.some((fragment) => fragment.text === "submitted snapshot"), "submitted snapshot changed");
  assert(pendingState.draft === "typed during save", "newer composer text was not persisted");

  const releaseOverlappingCaptures = await holdFragmentWrites();
  pending.value = "overlap first";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "t" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  pending.value = "overlap second";
  pending.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "d" }));
  pending.dispatchEvent(new KeyboardEvent("keydown", {
    key: "Enter", ctrlKey: true, bubbles: true, cancelable: true,
  }));
  await releaseOverlappingCaptures();
  await until(async () => (await frameWin().__ledgerTest.readAll()).fragments.length === 4);
  await wait(400);
  await reloadFrame();
  assert(frameDoc().querySelector("#entry").value === "", "committed overlap snapshot was restored as a draft");
  const overlapState = await frameWin().__ledgerTest.readAll();
  assert(overlapState.draft === "", "stale overlap draft survived both captures");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap first"), "first overlap capture missing");
  assert(overlapState.fragments.some((fragment) => fragment.text === "overlap second"), "second overlap capture missing");

  await seedFragments(101);
  await reloadFrame();
  assert(frameDoc().querySelectorAll("#stream .frag").length === 100, "rendered collection was not capped at 100");

  const releaseWrites = await holdFragmentWrites();
  const previousDocument = frameDoc();
  const loadedWithInput = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frameWin().location.reload();
  await until(() => frameDoc() !== previousDocument && Boolean(frameWin()?.__ledgerTest), "reloaded test interface missing");
  const startupEntry = frameDoc().querySelector("#entry");
  startupEntry.value = "typed before restore";
  startupEntry.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "e" }));
  await releaseWrites();
  await loadedWithInput;
  await frameWin().__ledgerTest.ready;
  assert(startupEntry.value === "typed before restore", "startup draft overwrote newer user input");
  frameWin().__ledgerTest.closeDatabase();
  document.body.dataset.status = "pass";
  result.textContent = "recovered drafts, preserved pending edits, and capped rendering";
}

run().catch((error) => {
  document.body.dataset.status = "fail";
  result.textContent = error.stack || String(error);
});
</script>
</body>
</html>
